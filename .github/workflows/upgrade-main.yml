name: upgrade-main
on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 0 * * 1
jobs:
  upgrade:
    name: Upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      patch_created: ${{ steps.create_patch.outputs.patch_created }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Upgrade dependencies
        id: upgrade_dependencies
        run: yarn projen upgrade
      - name: Find mutations
        id: create_patch
        run: |-
          git add .
          git diff --staged --patch --exit-code > repo.patch || echo "patch_created=true" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ./
      - name: Upload patch
        id: upload_patch
        if: steps.create_patch.outputs.patch_created
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repo.patch
          path: repo.patch
          overwrite: true
  pr:
    name: Create Pull Request
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ needs.upgrade.outputs.patch_created }}
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.PROJEN_APP_ID }}
          private-key: ${{ secrets.PROJEN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Download patch
        id: download_patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: repo.patch
          path: ${{ runner.temp }}
      - name: Apply patch
        id: apply_patch
        run: '[ -s ${{ runner.temp }}/repo.patch ] && git apply ${{ runner.temp }}/repo.patch || echo "Empty patch. Skipping."'
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Skip while a person has commits on the upgrade branch
        id: upgrade_guard
        run: |-
          set -euo pipefail
          rc=0; git ls-remote --exit-code origin refs/heads/github-actions/upgrade-main >/dev/null || rc=$?
          if [ "$rc" = 2 ]; then echo "human=false" >>"$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" != 0 ]; then echo "Could not read github-actions/upgrade-main from the repository." >&2; exit 1; fi
          refs="+refs/heads/main:refs/remotes/origin/main +refs/heads/github-actions/upgrade-main:refs/remotes/origin/github-actions/upgrade-main"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch -q --unshallow origin $refs; else git fetch -q origin $refs; fi
          who="$(git log --format='%ae%n%ce' "origin/main..origin/github-actions/upgrade-main")"
          if printf '%s\n' "$who" | grep -v '^$' | grep -qvxF '41898282+github-actions[bot]@users.noreply.github.com'; then
            echo "::warning::github-actions/upgrade-main has commits that aren't the upgrade workflow's; skipping so they are not overwritten. Merge its PR, or delete the branch (closing the PR leaves the branch, and this keeps skipping); then the next run upgrades again."
            echo "human=true" >>"$GITHUB_OUTPUT"
          else
            echo "human=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        id: create-pr
        if: steps.upgrade_guard.outputs.human != 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: |-
            chore(deps): upgrade dependencies

            Upgrades project dependencies. See details in [workflow run].

            [Workflow Run]: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ------

            *Automatically created by projen via the "upgrade-main" workflow*
          branch: github-actions/upgrade-main
          title: "chore(deps): upgrade dependencies"
          labels: auto-approve,auto-merge
          body: |-
            Upgrades project dependencies. See details in [workflow run].

            [Workflow Run]: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ------

            *Automatically created by projen via the "upgrade-main" workflow*
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: true
