# ~~ Generated by projen. To modify, edit .projenrc.ts and run "yarn projen".

name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CI: "true"
      PROJECT_NAME: cre-github-setup-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Generated files are current
        id: generated_files_are_current
        run: npx projen check:generated
      - name: Build
        id: build
        run: npx projen build
      - name: Upload content artifact
        id: upload_content_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: demo-content
          path: dist/content.zip
          retention-days: 7
          if-no-files-found: error
  deploy-upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      PROJECT_NAME: cre-github-setup-test
      ASSETS_PREFIX: cre-github-setup-test/${{ github.run_id }}/
      ASSETS_BUCKET_PREFIX: ${{ vars.ASSETS_BUCKET_PREFIX || secrets.ASSETS_BUCKET_PREFIX }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Download content artifact
        id: download_content_artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: demo-content
          path: dist
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_CREDS_TARGET_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Publish templates, assets and images
        id: publish_templates_assets_and_images
        run: npx projen deploy:upload
  deploy-prune:
    needs: deploy-upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      PROJECT_NAME: cre-github-setup-test
      ASSETS_PREFIX: cre-github-setup-test/${{ github.run_id }}/
      ASSETS_BUCKET_PREFIX: ${{ vars.ASSETS_BUCKET_PREFIX || secrets.ASSETS_BUCKET_PREFIX }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_CREDS_TARGET_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Remove old deploy prefixes
        id: remove_old_deploy_prefixes
        run: npx projen deploy:prune
